
name: Train Ticket Reservation CI-CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select Environment
        required: true
        type: choice
        options:
          - DEV
          - TEST
          - PRE-PROD
          - PROD

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Application using Maven
        run: mvn clean package

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainBook-WAR
          path: target/*.war

  deploy:
    name: Deploy to Tomcat
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: TrainBook-WAR
          path: target

      - name: Deploy Application to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(find target -maxdepth 1 -name '*.war' -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found"
            exit 1
          fi

          APP_NAME=$(basename "$WAR_FILE" .war)

          echo "Deploying application: $APP_NAME"
          echo "Selected Environment: ${{ inputs.environment }}"

          curl --fail --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/manager/text/deploy?path=/$APP_NAME&update=true"

      - name: Verify Deployment
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(find target -maxdepth 1 -name '*.war' -print -quit)
          APP_NAME=$(basename "$WAR_FILE" .war)

          echo "Checking deployment status..."

          curl --fail --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            "$TOMCAT_URL/manager/text/list"

          echo "Deployment completed successfully!"
          echo "Application URL: $TOMCAT_URL/$APP_NAME"
